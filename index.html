<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Deep Time — Earth, 4 billion years</title>
<style>
:root{--bg:#090c11;--panel:#0e131a;--panel2:#131922;--line:rgba(255,255,255,.09);--tx:#ebe6da;--dim:#98a2ae;--faint:#6d7783;
--gold:#e6c36a;--life:#7fd39a;--ext:#ff6a4d;--clim:#79b8ff;--o2:#5fd6c8;--temp:#ff9a5c;
--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#chart:focus-visible{outline-offset:-2px}
#app{display:grid;height:100%;grid-template-columns:minmax(0,1fr) 392px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage panel" "tl tl"}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font:italic 400 20px/1 var(--serif);letter-spacing:.01em}
.top h1 small{font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-left:10px;font-style:normal}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);min-height:30px}
.tbtn:hover{color:var(--tx);border-color:rgba(255,255,255,.25)}
.tbtn[aria-pressed=true]{color:var(--gold);border-color:rgba(230,195,106,.5)}
.stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;touch-action:none;background:#0a0d12}
#globe{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#globe.drag{cursor:grabbing}
.readout{position:absolute;left:18px;top:14px;pointer-events:none;max-width:60%}
.readout .age{font:400 clamp(34px,5.2vw,58px)/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.readout .long{color:var(--dim);font-size:13px;margin-top:4px}
.readout .period{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;color:var(--tx);background:rgba(10,13,18,.6);padding:3px 9px 3px 6px;border-radius:99px;border:1px solid var(--line)}
.readout .period i{width:10px;height:10px;border-radius:3px;display:block}
.conf{position:absolute;right:14px;top:14px;text-align:right;pointer-events:none;max-width:44%}
.conf .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.conf .pips{display:flex;gap:3px;justify-content:flex-end;margin:5px 0 3px}
.conf .pips b{width:16px;height:5px;border-radius:2px;background:rgba(255,255,255,.14)}
.conf .pips b.on{background:var(--gold)}
.conf .val{font-size:12px;color:var(--tx)}
.ctl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(10px + 0px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(0deg,rgba(9,12,17,.86),rgba(9,12,17,0))}
.play{display:flex;align-items:center;gap:8px;background:var(--gold);color:#17130a;border:0;border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px}
.play:hover{filter:brightness(1.08)}
select.spd{background:rgba(14,19,26,.85);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:38px;font-size:12.5px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{background:rgba(14,19,26,.8);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--dim);min-height:30px}
.chip:hover{color:var(--tx);border-color:rgba(255,255,255,.28)}
.chip.on{color:#17130a;background:var(--gold);border-color:var(--gold)}
.hint{position:absolute;left:18px;bottom:62px;font-size:11px;color:var(--faint);pointer-events:none}
.panel{grid-area:panel;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);min-height:0;scrollbar-width:thin;scrollbar-color:#2a323d transparent}
.card{padding:16px 18px;border-bottom:1px solid var(--line)}
.card h2{margin:0 0 8px;font:600 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.stg-t{font:400 20px/1.2 var(--serif);margin:0 0 6px}
.stg-x{color:var(--dim);margin:0}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.met{background:var(--panel2);border-radius:8px;padding:9px 11px}
.met .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.met .v{font:400 20px/1.2 var(--serif);font-variant-numeric:tabular-nums;margin-top:2px}
.met .r{font-size:11.5px;color:var(--dim)}
.met.o .v{color:var(--o2)}.met.t .v{color:var(--temp)}
.met.wide{grid-column:1/-1}
.act{display:flex;flex-direction:column;gap:6px}
.act button{display:flex;align-items:center;gap:9px;text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:8px 10px;min-height:38px}
.act button:hover{border-color:rgba(255,255,255,.2)}
.act .dot{width:9px;height:9px;border-radius:50%;flex:none}
.act .dot.ext{border-radius:0;clip-path:polygon(50% 100%,0 0,100% 0)}
.act .dot.super{border-radius:2px}
.act small{display:block;color:var(--faint);font-size:11px}
.empty{color:var(--faint);font-size:13px;margin:0}
.detail{background:var(--panel2);border-bottom:1px solid var(--line);padding:16px 18px;position:relative}
.detail[hidden]{display:none}
.detail .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;background:transparent;color:var(--dim);font-size:20px;border-radius:8px}
.detail .x:hover{background:rgba(255,255,255,.07);color:var(--tx)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.detail h3{font:400 22px/1.2 var(--serif);margin:9px 30px 4px 0}
.dates{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:10px;align-items:center;margin:12px 0 2px}
.ev .pp{display:flex;gap:3px}.ev .pp b{width:14px;height:6px;border-radius:2px;background:rgba(255,255,255,.14)}
.ev .pp b.on{background:var(--c)}
.ev span{font-size:13px;font-weight:600}
.evn{font-size:12.5px;color:var(--dim);margin:2px 0 0}
.sec{margin-top:13px}
.sec h4{margin:0 0 3px;font:600 10.5px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sec p{margin:0}
.sec.unc{border-left:2px solid var(--ext);padding-left:11px}
.sec.unc h4{color:#ff9a86}
.srcs{margin:0;padding-left:16px;color:var(--dim);font-size:12.5px}
.srcs li{margin:2px 0}
.jump{margin-top:14px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--tx);min-height:34px}
.jump:hover{border-color:var(--gold);color:var(--gold)}
.confbox p{margin:6px 0 0;color:var(--dim)}
.confbox .h{font:400 17px/1.2 var(--serif)}
details.about summary{cursor:pointer;color:var(--faint);font:600 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;list-style:none;padding:2px 0}
details.about summary::-webkit-details-marker{display:none}
details.about summary::before{content:"+ ";}
details.about[open] summary::before{content:"− ";}
details.about p,details.about li{color:var(--dim);font-size:12.5px}
details.about ul{padding-left:16px;margin:6px 0}
.timeline{grid-area:tl;position:relative;border-top:1px solid var(--line);background:#0b0f15;padding:8px 0 calc(6px + var(--safe-b));touch-action:none}
#chart{display:block;width:100%;cursor:crosshair}
#tip{position:fixed;z-index:30;pointer-events:none;background:#1b222c;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#tip b{display:block;font-weight:600}#tip span{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
 html,body{height:auto}
 #app{display:block;height:auto}
 .top{padding:9px 12px;position:sticky;top:0;background:var(--bg);z-index:12}
 .top h1 small{display:none}
 .top h1{white-space:nowrap;font-size:18px}
 .tools{flex-wrap:nowrap;gap:4px}
 .tbtn{padding:4px 7px;font-size:11px}
 .stage{height:min(62vh,520px);min-height:340px}
 .readout .age{font-size:38px}.readout{left:12px;top:10px}
 .conf{right:10px;top:10px}
 .hint{display:none}
 .timeline{position:sticky;bottom:0;z-index:11;border-top:1px solid var(--line)}
 .panel{border-left:0;overflow:visible}
 .detail{position:fixed;left:0;right:0;bottom:0;z-index:25;max-height:50vh;overflow:auto;border-top:1px solid rgba(255,255,255,.18);border-radius:14px 14px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.6);padding-bottom:calc(20px + var(--safe-b))}
 .chips{margin-left:0;width:100%}
 .ctl{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
 <header class="top">
  <h1>Deep Time<small>Earth · 4 billion years</small></h1>
  <div class="tools">
   <button class="tbtn" id="bScale" aria-pressed="false" title="Toggle between a compressed axis (recent time stretched) and a true linear axis">Axis: compressed</button>
   <button class="tbtn" id="bLabels" aria-pressed="true">Labels</button>
   <button class="tbtn" id="bFollow" aria-pressed="true" title="Keep the landmasses centred as you move through time">Follow land</button>
  </div>
 </header>
 <section class="stage" id="stage">
  <canvas id="globe" aria-label="Interactive globe showing continent positions at the selected time. Drag to rotate."></canvas>
  <div class="readout"><div class="age" id="ageBig">—</div><div class="long" id="ageLong"></div><div class="period" id="period"><i></i><span></span></div></div>
  <div class="conf" id="conf"><div class="lbl">Reconstruction confidence</div><div class="pips"></div><div class="val"></div></div>
  <div class="hint">Drag to rotate · scroll or pinch to zoom · double-click to reset</div>
  <div class="ctl">
   <button class="play" id="bPlay" aria-label="Play through time"><span id="playI">▶</span><span id="playT">Play</span></button>
   <select class="spd" id="spd" aria-label="Playback speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
   <div class="chips" id="chips" role="group" aria-label="Jump to supercontinent"></div>
  </div>
 </section>
 <aside class="panel" id="panel" aria-label="Details">
  <div class="detail" id="detail" hidden role="region" aria-label="Selected feature"></div>
  <div class="card" id="cNow"></div>
  <div class="card confbox" id="cConf"></div>
  <div class="card"><details class="about" id="about"></details></div>
 </aside>
 <section class="timeline" id="tl">
  <canvas id="chart" tabindex="0" role="slider" aria-label="Geologic time" aria-valuemin="0" aria-valuemax="4000"></canvas>
 </section>
</div>
<div id="tip"></div>

/* ============ CORE: math, geometry, globe renderer ============ */
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ll2v=(lon,lat)=>{const la=lat*D2R,lo=lon*D2R,c=Math.cos(la);return [c*Math.cos(lo),c*Math.sin(lo),Math.sin(la)];};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixc(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function stops(tbl,age){ // tbl: [[age,hex],...] descending age
  if(age>=tbl[0][0])return hex2rgb(tbl[0][1]);
  for(let i=0;i<tbl.length-1;i++){const a=tbl[i],b=tbl[i+1];if(age<=a[0]&&age>=b[0]){const u=(a[0]-age)/(a[0]-b[0]);return mixc(hex2rgb(a[1]),hex2rgb(b[1]),u);}}
  return hex2rgb(tbl[tbl.length-1][1]);}
function interpTable(tbl,age,cols){ // [age,v1,v2..] descending age -> array of values
  if(age>=tbl[0][0])return tbl[0].slice(1);
  for(let i=0;i<tbl.length-1;i++){const a=tbl[i],b=tbl[i+1];if(age<=a[0]&&age>=b[0]){const u=(a[0]-age)/((a[0]-b[0])||1);return a.slice(1).map((v,k)=>lerp(v,b[k+1],u));}}
  return tbl[tbl.length-1].slice(1);}

/* ----- quaternion frames ----- */
function qslerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];let s=1;if(d<0){d=-d;s=-1;}
  let k0,k1;if(d>0.9995){k0=1-t;k1=t*s;}else{const th=Math.acos(d),sn=Math.sin(th);k0=Math.sin((1-t)*th)/sn;k1=s*Math.sin(t*th)/sn;}
  const q=[k0*a[0]+k1*b[0],k0*a[1]+k1*b[1],k0*a[2]+k1*b[2],k0*a[3]+k1*b[3]];const l=Math.hypot(...q);return q.map(v=>v/l);}
function q2m(q){const[x,y,z,w]=q;return [1-2*(y*y+z*z),2*(x*y-z*w),2*(x*z+y*w),2*(x*y+z*w),1-2*(x*x+z*z),2*(y*z-x*w),2*(x*z-y*w),2*(y*z+x*w),1-2*(x*x+y*y)];}
let _rc={age:-1,val:null};
function rotationsAt(age){
  if(_rc.age===age)return _rc.val;
  let i=0;while(i<FRAMES.length-2&&FRAMES[i+1].a<age)i++;
  const A=FRAMES[i],Bf=FRAMES[i+1];const u=clamp((age-A.a)/(Bf.a-A.a),0,1);
  const out={};KEYS.forEach((k,j)=>{out[k]=q2m(qslerp(A.q[j],Bf.q[j],u));});
  _rc={age,val:out};return out;}

/* ----- geometry prep ----- */
function densify(pts,maxDeg){
  const out=[];const n=pts.length;
  for(let i=0;i<n;i++){
    const a=ll2v(pts[i][0],pts[i][1]),b=ll2v(pts[(i+1)%n][0],pts[(i+1)%n][1]);
    const d=clamp(dot(a,b),-1,1),ang=Math.acos(d)/D2R,k=Math.max(1,Math.ceil(ang/maxDeg));
    const sn=Math.sin(Math.acos(d));
    for(let j=0;j<k;j++){const t=j/k;let p;
      if(sn<1e-6)p=a;else{const th=Math.acos(d);const c0=Math.sin((1-t)*th)/sn,c1=Math.sin(t*th)/sn;p=[c0*a[0]+c1*b[0],c0*a[1]+c1*b[1],c0*a[2]+c1*b[2]];}
      out.push(p);}
  }
  return out;}
function ringOrient(r){let s=[0,0,0],m=[0,0,0];const n=r.length;
  for(let i=0;i<n;i++){const c=cross(r[i],r[(i+1)%n]);s[0]+=c[0];s[1]+=c[1];s[2]+=c[2];m[0]+=r[i][0];m[1]+=r[i][1];m[2]+=r[i][2];}
  return dot(s,m)>=0?1:-1;}
const GEO={};
KEYS.forEach(k=>{const b=BLOCKS[k];
  GEO[k]={name:b.n,anchor:ll2v(b.a[1],b.a[0]),
    polys:b.p.map(p=>{const r=densify(p.p,2.5);return {r,o:ringOrient(r),m:p.m||9999};}),
    cores:b.c.map(c=>{const r=densify(c,2);return {r,o:ringOrient(r)};})};});
const AREA={na:24,gl:2.2,sa:17.8,af:30,mg:.6,ar:3.2,eu:10,sib:13,cas:9,chn:15,in:3.2,au:7.7,an:14};

/* ----- appearance as function of age ----- */
const LAND=[[4000,'#5a4a40'],[2500,'#7b5b45'],[800,'#8a6547'],[500,'#8a6b4b'],[470,'#88704f'],[430,'#7d7c4c'],[400,'#5f8443'],[360,'#3f7a45'],[300,'#2c6b42'],[265,'#5c7a44'],[252,'#8b7b4d'],[245,'#85804f'],[220,'#6a8248'],[150,'#4f8a4a'],[100,'#4b8c4a'],[66,'#3f8447'],[40,'#4b8b4c'],[30,'#5c904c'],[20,'#7f9a52'],[8,'#9a9d58'],[3,'#82994f'],[0,'#6a9550']];
const OCEAN=[[4000,'#1b3f3c'],[2400,'#1c4a4a'],[1800,'#1a4358'],[800,'#123c62'],[540,'#0f3a68'],[0,'#0c3660']];
const ATMO=[[4000,'#d18b52'],[2500,'#c98a58'],[2000,'#9aa6c8'],[1000,'#7fb0e8'],[0,'#7cb8ff']];
const CRATON='#a06f52';
function polarIce(age){const v=interpTable(ICE,age);return {n:v[0],s:v[1]};}

/* ----- view state and projection ----- */
const view={lat:20,lon:20,zoom:1};
function basis(){const la=clamp(view.lat,-88,88)*D2R,lo=view.lon*D2R;
  const c=[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)];
  const e=norm(cross([0,0,1],c));const n=cross(c,e);return {c,e,n};}

function clipRing(X,Y,Z,orient,outs){ // pushes one or more rings (arrays of [x,y] in unit disk) to outs; returns true if anything visible
  const n=X.length;let any=false,all=true;
  for(let i=0;i<n;i++){if(Z[i]>=0)any=true;else all=false;}
  if(!any)return false;
  if(all){const o=[];for(let i=0;i<n;i++)o.push([X[i],Y[i]]);outs.push(o);return true;}
  let s0=-1;for(let i=0;i<n;i++){if(Z[i]>=0&&Z[(i-1+n)%n]<0){s0=i;break;}}
  const chains=[];let cur=null;
  const cross0=(i,k)=>{const pz=Z[i],qz=Z[k];const t=pz/(pz-qz);let x=X[i]+(X[k]-X[i])*t,y=Y[i]+(Y[k]-Y[i])*t;const l=Math.hypot(x,y)||1;return [x/l,y/l];};
  for(let j=0;j<n;j++){
    const i=((s0-1+j)%n+n)%n,k=(i+1)%n;const pv=Z[i]>=0,qv=Z[k]>=0;
    if(pv&&qv){cur.pts.push([X[k],Y[k]]);}
    else if(pv&&!qv){const e=cross0(i,k);cur.pts.push(e);cur.exitA=Math.atan2(e[1],e[0]);chains.push(cur);cur=null;}
    else if(!pv&&qv){const e=cross0(i,k);cur={pts:[e,[X[k],Y[k]]],entryA:Math.atan2(e[1],e[0]),exitA:0};}
  }
  const m=chains.length;if(!m)return false;
  const dirD=(a,b)=>orient>0?(((b-a)%TAU)+TAU)%TAU:(((a-b)%TAU)+TAU)%TAU; // angular travel from exit a to entry b in polygon direction
  const next=chains.map(c=>{let best=0,bd=1e9;for(let q=0;q<m;q++){const d=dirD(c.exitA,chains[q].entryA);if(d<bd){bd=d;best=q;}}return best;});
  const seen=new Array(m).fill(false);
  for(let st=0;st<m;st++){
    if(seen[st])continue;
    const ring=[];let c=st,guard=0;
    while(!seen[c]&&guard++<m+2){
      seen[c]=true;const ch=chains[c];for(const p of ch.pts)ring.push(p);
      const nx=next[c];const d=dirD(ch.exitA,chains[nx].entryA);
      const steps=Math.max(1,Math.ceil(d/0.1));
      for(let q=1;q<steps;q++){const a=ch.exitA+(orient>0?1:-1)*d*q/steps;ring.push([Math.cos(a),Math.sin(a)]);}
      c=nx;}
    if(ring.length>2)outs.push(ring);}
  return outs.length>0;}

/* draw one ring; returns true if drawn. rot: 3x3 block rotation (row major) */
const _X=[],_Y=[],_Z=[];
function projectRing(ring,rot,bs,X,Y,Z){
  const m=rot,e=bs.e,nn=bs.n,c=bs.c;
  // combined rows: viewRow(e/n/c) * rot
  const re=[e[0]*m[0]+e[1]*m[3]+e[2]*m[6],e[0]*m[1]+e[1]*m[4]+e[2]*m[7],e[0]*m[2]+e[1]*m[5]+e[2]*m[8]];
  const rn=[nn[0]*m[0]+nn[1]*m[3]+nn[2]*m[6],nn[0]*m[1]+nn[1]*m[4]+nn[2]*m[7],nn[0]*m[2]+nn[1]*m[5]+nn[2]*m[8]];
  const rc=[c[0]*m[0]+c[1]*m[3]+c[2]*m[6],c[0]*m[1]+c[1]*m[4]+c[2]*m[7],c[0]*m[2]+c[1]*m[5]+c[2]*m[8]];
  X.length=Y.length=Z.length=ring.length;
  for(let i=0;i<ring.length;i++){const p=ring[i];X[i]=re[0]*p[0]+re[1]*p[1]+re[2]*p[2];Y[i]=rn[0]*p[0]+rn[1]*p[1]+rn[2]*p[2];Z[i]=rc[0]*p[0]+rc[1]*p[1]+rc[2]*p[2];}
}
const IDENT=[1,0,0,0,1,0,0,0,1];
function ringPath(ctx,pts,cx,cy,R){ctx.beginPath();pts.forEach((p,i)=>{const x=cx+p[0]*R,y=cy-p[1]*R;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();}
let stars=null;
function makeStars(){const r=[];let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<160;i++)r.push([rnd(),rnd(),rnd()*1.1+.25,rnd()*.6+.25]);return r;}

const opts={labels:true,padT:0,padB:0};
function drawGlobe(ctx,W,H,age,rots){
  ctx.clearRect(0,0,W,H);
  if(!stars)stars=makeStars();
  // backdrop
  ctx.fillStyle='#0a0d12';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=s[3]*.55;ctx.fillRect(s[0]*W,s[1]*H,s[2],s[2]);}
  ctx.globalAlpha=1;
  const pT=opts.padT||0,pB=opts.padB||0,aH=H-pT-pB;const R=Math.min(W,aH)*(pT?0.47:0.44)*view.zoom,cx=W/2,cy=pT+aH/2;
  const bs=basis();
  const oc=stops(OCEAN,age),atm=stops(ATMO,age);
  // atmosphere glow
  const glow=ctx.createRadialGradient(cx,cy,R*.96,cx,cy,R*1.16);
  glow.addColorStop(0,rgb(atm,.55));glow.addColorStop(.35,rgb(atm,.18));glow.addColorStop(1,rgb(atm,0));
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,R*1.16,0,TAU);ctx.fill();
  // ocean disc
  const og=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
  og.addColorStop(0,rgb(mixc(oc,[255,255,255],.16)));og.addColorStop(.55,rgb(oc));og.addColorStop(1,rgb(mixc(oc,[0,0,0],.55)));
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.clip();
  // graticule
  ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.07)';
  for(let lat=-60;lat<=60;lat+=30){const ring=[];for(let lo=0;lo<360;lo+=6)ring.push(ll2v(lo,lat));
    const n=ring.length;
    const X=[],Y=[],Z=[];const e=bs.e,nn=bs.n,c=bs.c;
    for(const p of ring){X.push(dot(e,p));Y.push(dot(nn,p));Z.push(dot(c,p));}
    ctx.beginPath();let pen=false;
    for(let i=0;i<n;i++){if(Z[i]>=0){const x=cx+X[i]*R,y=cy-Y[i]*R;pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true;}else pen=false;}
    ctx.stroke();}
  for(let lo=0;lo<360;lo+=30){const X=[],Y=[],Z=[];const e=bs.e,nn=bs.n,c=bs.c;
    for(let lat=-88;lat<=88;lat+=4){const p=ll2v(lo,lat);X.push(dot(e,p));Y.push(dot(nn,p));Z.push(dot(c,p));}
    ctx.beginPath();let pen=false;for(let i=0;i<X.length;i++){if(Z[i]>=0){const x=cx+X[i]*R,y=cy-Y[i]*R;pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true;}else pen=false;}ctx.stroke();}
  // equator
  {const e=bs.e,nn=bs.n,c=bs.c;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1.2;ctx.setLineDash([2,4]);ctx.beginPath();let pen=false;
   for(let lo=0;lo<=360;lo+=3){const p=ll2v(lo,0);const z=dot(c,p);if(z>=0){const x=cx+dot(e,p)*R,y=cy-dot(nn,p)*R;pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true;}else pen=false;}
   ctx.stroke();ctx.setLineDash([]);}
  // ---- continents
  const landc=stops(LAND,age);
  const fullA=age<=541?1:(age<=1000?lerp(.9,.45,(age-541)/459):(age<=2500?lerp(.45,.2,(age-1000)/1500):lerp(.2,.08,clamp((age-2500)/1500,0,1))));
  const ghost=age>541;
  const craFade=age>3500?lerp(1,.3,(age-3500)/500):1;
  const fill=rgb(landc,fullA),shelf=rgb(mixc(oc,[190,225,235],.45),.22);
  const draw=[];
  for(const k of KEYS){
    const g=GEO[k],rot=rots[k];
    for(const p of g.polys){ if(age>p.m)continue;
      const n=p.r.length;projectRing(p.r,rot,bs,_X,_Y,_Z);
      const outs=[];if(!clipRing(_X,_Y,_Z,p.o,outs))continue;
      for(const o of outs)draw.push(o);
    }
  }
  // shelves
  ctx.lineJoin='round';
  if(age<=541||true){ctx.lineWidth=Math.max(3,R*.018);ctx.strokeStyle=shelf;for(const o of draw){ringPath(ctx,o,cx,cy,R);ctx.stroke();}}
  ctx.fillStyle=fill;
  if(ghost){ctx.setLineDash([3,3]);}
  for(const o of draw){ringPath(ctx,o,cx,cy,R);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=ghost?'rgba(235,225,210,.35)':'rgba(15,20,25,.45)';ctx.stroke();}
  ctx.setLineDash([]);
  // cratonic cores
  if(age>541){
    const cc=hex2rgb(CRATON);
    for(const k of KEYS){const g=GEO[k],rot=rots[k];
      for(const c of g.cores){projectRing(c.r,rot,bs,_X,_Y,_Z);const outs=[];if(!clipRing(_X,_Y,_Z,c.o,outs))continue;
        for(const out of outs){ringPath(ctx,out,cx,cy,R);ctx.fillStyle=rgb(cc,.92*craFade);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=`rgba(255,235,210,${.5*craFade})`;ctx.stroke();}}}
  }
  // ---- ice
  const ice=polarIce(age);
  const iceCol='rgba(236,244,252,.93)';
  const capPole=(edge,north)=>{
    const ring=[];
    for(let i=0;i<90;i++){const lo=(north?i:90-i)*4;ring.push(ll2v(lo,north?edge:-edge));}
    const X=[],Y=[],Z=[];for(const p of ring){X.push(dot(bs.e,p));Y.push(dot(bs.n,p));Z.push(dot(bs.c,p));}
    const o=ringOrient(ring);const outs=[];
    if(clipRing(X,Y,Z,o,outs)){for(const out of outs){ringPath(ctx,out,cx,cy,R);ctx.fillStyle=iceCol;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(180,205,230,.8)';ctx.stroke();}}
    else{const pole=[0,0,north?1:-1];const ang=Math.acos(clamp(dot(pole,bs.c),-1,1));const rad=(90-edge)*D2R;
      if(ang<rad){ctx.fillStyle=iceCol;ctx.fillRect(cx-R,cy-R,2*R,2*R);}}
  };
  if(ice.n<89.5)capPole(ice.n,true);
  if(ice.s<89.5)capPole(ice.s,false);
  ctx.restore();
  // limb shading
  const sh=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.2,cx,cy,R);
  sh.addColorStop(0,'rgba(255,255,255,.06)');sh.addColorStop(.6,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,10,25,.55)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  ctx.strokeStyle=rgb(atm,.35);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
  // ---- labels
  if(opts.labels){
    ctx.textAlign='center';ctx.textBaseline='middle';
    const nameFor=k=>{
      if(k==='na')return age>250?'Laurentia':'North America';
      if(k==='eu')return age>250?'Baltica':'Europe';
      if(k==='sa')return age>541?'Amazonia':'South America';
      if(k==='af')return age>541?'Congo–Kalahari':'Africa';
      if(k==='cas')return 'Central Asia';if(k==='chn')return 'China & SE Asia';
      return GEO[k].name;};
    const small=R<170;

    const sAnch=[];for(const s of actS){let sum=[0,0,0];s.members.forEach(k=>{const rot=rots[k],a=GEO[k].anchor;const w=age>2500?1:AREA[k];
        sum[0]+=w*(rot[0]*a[0]+rot[1]*a[1]+rot[2]*a[2]);sum[1]+=w*(rot[3]*a[0]+rot[4]*a[1]+rot[5]*a[2]);sum[2]+=w*(rot[6]*a[0]+rot[7]*a[1]+rot[8]*a[2]);});
      const v=norm(sum);sAnch.push([cx+dot(bs.e,v)*R,cy-dot(bs.n,v)*R-(R*.1)]);}
    ctx.font=`${small?9:11}px system-ui,-apple-system,"Segoe UI",sans-serif`;
    for(const k of KEYS){
      if(age>2500&&!BLOCKS[k].c.length)continue;

      const rot=rots[k];const a=GEO[k].anchor;
      const v=[rot[0]*a[0]+rot[1]*a[1]+rot[2]*a[2],rot[3]*a[0]+rot[4]*a[1]+rot[5]*a[2],rot[6]*a[0]+rot[7]*a[1]+rot[8]*a[2]];

      ctx.fillStyle='#f1ece2';ctx.fillText(nameFor(k),x,y);}
    ctx.globalAlpha=1;
    // supercontinent name
    const act=SUPERS.filter(s=>s.id!=='modern'&&age<=s.start&&age>=s.end&&!(s.id==='gondwana'&&age<335));
    for(const s of act){
      let sum=[0,0,0];s.members.forEach(k=>{const rot=rots[k],a=GEO[k].anchor;const w=age>2500?1:AREA[k];
        sum[0]+=w*(rot[0]*a[0]+rot[1]*a[1]+rot[2]*a[2]);sum[1]+=w*(rot[3]*a[0]+rot[4]*a[1]+rot[5]*a[2]);sum[2]+=w*(rot[6]*a[0]+rot[7]*a[1]+rot[8]*a[2]);});
      const v=norm(sum);const z=dot(bs.c,v);if(z<.3)continue;

      ctx.lineWidth=4;ctx.strokeStyle='rgba(10,14,20,.75)';ctx.strokeText(s.name.replace(' (Columbia)',''),x,y);
      ctx.fillStyle='#fff8e8';ctx.fillText(s.name.replace(' (Columbia)',''),x,y);}

function hitTest(px,py){

  const o=interpTable(O2,age),t=interpTable(TEMP,age);
  nowEls.o.textContent=(o[0]<0.001?'trace':fmtO2(o[0])+'% of air');
  nowEls.or.textContent=o[0]<0.001?'essentially none free in air':'uncertainty range '+fmtO2(o[1])+'–'+fmtO2(o[2])+'%';
  nowEls.t.textContent=T(t[0])+' °C';nowEls.tr.textContent='range '+T(t[1])+' to '+T(t[2])+' °C';
  const ic=polarIce(age);const f=v=>v>=89.5?null:Math.round(v);
  const n=f(ic.n),s=f(ic.s);
  nowEls.ice.textContent=(n===null&&s===null)?'Ice-free poles':((n!==null?'North to ~'+n+'°':'North ice-free')+' · '+(s!==null?'South to ~'+s+'°':'South ice-free')+(Math.min(n??90,s??90)<25?' (Snowball state)':''));
  const act=ITEMS.filter(e=>isActive(e,age));
  const sig=act.map(e=>e.id).join(',');
  if(sig!==nowSig){nowSig=sig;
    nowEls.act.replaceChildren(...(act.length?act.map(e=>h('button',{type:'button',onclick:()=>select(e,false)},
      h('span',{class:'dot '+e.cat,style:'background:'+CAT_COL[e.cat]}),
      h('span',null,e.name,h('small',null,CAT_NAME[e.cat]+' · '+e.ev)))):[h('p',{class:'empty'},'No catalogued milestone falls at exactly this time; drag the timeline to explore.')]));}
}
function buildStatic(){
  buildNow();
  const ab=$('#about');
  ab.append(h('summary',null,'About this visualisation'),
    h('p',null,'A teaching tool, not a research plate model. Continents are rigid blocks drawn with modern outlines, moved between a few dozen hand-fitted positions. Everything before about 540 Ma is drawn dashed and faded on purpose: it is one published possibility among several.'),
    h('ul',null,
      h('li',null,'0–250 Ma: blocks move between the present day and a Pangaea fit; India, Madagascar and Australia follow simplified paths.'),
      h('li',null,'250–540 Ma: positions follow published paleogeographic syntheses, simplified.'),
      h('li',null,'Before 540 Ma: cratons are drawn as brown cores inside ghosted outlines. Only latitude is really constrained by paleomagnetism.'),
      h('li',null,'Before ~3 Ga: positions are placeholders.'),
      h('li',null,'Curves for oxygen and temperature are smoothed syntheses with wide ranges shown as shaded bands.')),
    h('p',null,'Reconstruction references:'),
    h('ul',null,RECON_SRC.map(s=>h('li',null,s))),
    h('p',null,'Everything here runs offline from this single file.'));
}
function updateConf(age){
  const c=confAt(age);
  const pips=$('#conf .pips');if(!pips.children.length){for(let i=0;i<5;i++)pips.append(h('b'));}
  [...pips.children].forEach((b,i)=>b.className=i<c.lvl?'on':'');
  $('#conf .val').textContent=c.label;
  const box=$('#cConf');
  if(box.dataset.k!==c.label){box.dataset.k=c.label;
    box.replaceChildren(h('h2',null,'How sure are we about the map?'),h('div',{class:'h'},c.label),h('p',null,c.txt));}
}

/* ---------- frame update ---------- */
let lastLabel='',lastPeriod='';
function updateUI(age){
  const ageTxt=fmtAge(age);
  if(ageTxt!==lastLabel){lastLabel=ageTxt;$('#ageBig').textContent=ageTxt;$('#ageLong').textContent=fmtAgeLong(age);}
  const p=periodAt(age);
  if(p[0]!==lastPeriod){lastPeriod=p[0];const pe=$('#period');pe.firstChild.style.background=p[3];pe.lastChild.textContent=p[0]+' · '+p[4];}
  updateNow(age);updateConf(age);
  chipBtns.forEach(([b,s])=>{const on=age<=s.start&&age>=s.end;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
  chart.cv.setAttribute('aria-valuenow',Math.round(age));chart.cv.setAttribute('aria-valuetext',fmtAgeLong(age)+', '+p[0]);
}

/* ---------- main loop ---------- */
function shortest(a,b){let d=((b-a)%360+540)%360-180;return d;}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=state.lastT?Math.min(.1,(ts-state.lastT)/1000):0;state.lastT=ts;
  if(state.playing){
    const s=ageToS(state.age)+dt*state.speed/40;
    if(s>=1){state.age=0;state.playing=false;syncPlay();}else state.age=sToAge(s);
    state.dirty=true;}
  const rots=rotationsAt(Math.round(state.age*100)/100);
  if(state.follow&&!drag.on){
    const c=massCentroid(state.age,rots);
    const k=RM?1:1-Math.exp(-dt*3.5);
    const dl=shortest(view.lon,c.lon),dla=clamp(c.lat,-55,55)-view.lat;
    if(Math.abs(dl)>.05||Math.abs(dla)>.05){view.lon+=dl*k;view.lat+=dla*k;state.dirty=true;}}
  if(!state.dirty)return;
  state.dirty=false;
  const dpr=chart.dpr;
  gctx.setTransform(dpr,0,0,dpr,0,0);
  const g=drawGlobe(gctx,gW,gH,state.age,rots);gR=g.R;
  chart.ctx.setTransform(dpr,0,0,dpr,0,0);
  drawChart(state.age);
  updateUI(state.age);
}

/* ---------- globe interaction ---------- */
const drag={on:false,x:0,y:0,pts:new Map(),d0:0,z0:1};
gcv.addEventListener('pointerdown',e=>{gcv.setPointerCapture(e.pointerId);drag.pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(drag.pts.size===1){drag.on=true;drag.x=e.clientX;drag.y=e.clientY;gcv.classList.add('drag');}
  else if(drag.pts.size===2){const [a,b]=[...drag.pts.values()];drag.d0=Math.hypot(a[0]-b[0],a[1]-b[1]);drag.z0=view.zoom;}});
gcv.addEventListener('pointermove',e=>{if(!drag.pts.has(e.pointerId))return;drag.pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(drag.pts.size===2){const [a,b]=[...drag.pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);view.zoom=clamp(drag.z0*d/drag.d0,.6,3.2);state.dirty=true;return;}
  if(drag.on){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    const k=1/(gR*D2R);view.lon-=dx*k;view.lat=clamp(view.lat+dy*k,-85,85);
    if(state.follow&&(Math.abs(dx)+Math.abs(dy)>0)){setFollow(false);}
    state.dirty=true;}});
const endp=e=>{drag.pts.delete(e.pointerId);if(drag.pts.size===0){drag.on=false;gcv.classList.remove('drag');}else if(drag.pts.size===1){const [p]=[...drag.pts.values()];drag.x=p[0];drag.y=p[1];drag.on=true;}};
gcv.addEventListener('pointerup',endp);gcv.addEventListener('pointercancel',endp);
gcv.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*Math.exp(-e.deltaY*.0014),.6,3.2);state.dirty=true;},{passive:false});
gcv.addEventListener('dblclick',()=>{view.zoom=1;setFollow(true);});
function setFollow(v){state.follow=v;$('#bFollow').setAttribute('aria-pressed',v?'true':'false');state.dirty=true;}

/* ---------- chart interaction ---------- */
const tip=$('#tip');
const cpt=e=>{const r=chart.cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,r];};
let cdrag=null;
chart.cv.addEventListener('pointerdown',e=>{chart.cv.setPointerCapture(e.pointerId);chart.cv.focus({preventScroll:true});
  const [x,y]=cpt(e);const hit=hitTest(x,y);
  cdrag={sx:x,hit:hit||null,moved:false};
  if(!cdrag.hit){setAge(ageOfX(x),true);}});
chart.cv.addEventListener('pointermove',e=>{
  const [x,y,r]=cpt(e);
  if(cdrag){if(Math.abs(x-cdrag.sx)>5)cdrag.moved=true;if(!cdrag.hit||cdrag.moved){setAge(ageOfX(x),true);}tip.style.display='none';return;}
  const hit=hitTest(x,y);const prev=chart.hover;chart.hover=hit;
  if(hit){const it=hit.item;tip.replaceChildren(h('b',null,it.name),h('span',null,CAT_NAME[it.cat]+' · '+fmtRange(it)+' · '+it.ev));
    tip.style.display='block';const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=clamp(e.clientX-tw/2,6,innerWidth-tw-6)+'px';tip.style.top=(r.top+hit.y-th-8)+'px';chart.cv.style.cursor='pointer';}
  else{tip.style.display='none';chart.cv.style.cursor='crosshair';}
  if(prev!==hit)state.dirty=true;});
chart.cv.addEventListener('pointerup',e=>{if(cdrag){if(cdrag.hit&&!cdrag.moved)select(cdrag.hit.item,true);cdrag=null;}});
chart.cv.addEventListener('pointercancel',()=>{cdrag=null;});
chart.cv.addEventListener('pointerleave',()=>{tip.style.display='none';if(chart.hover){chart.hover=null;state.dirty=true;}});
chart.cv.addEventListener('keydown',e=>{
  const s=ageToS(state.age);let ns=null;const big=e.shiftKey?.05:.006;
  if(e.key==='ArrowLeft'||e.key==='ArrowDown')ns=s-big;       // toward the past
  else if(e.key==='ArrowRight'||e.key==='ArrowUp')ns=s+big;   // toward the present
  else if(e.key==='PageDown')ns=s-.05;else if(e.key==='PageUp')ns=s+.05;
  else if(e.key==='Home'){setAge(AGE_MAX,true);e.preventDefault();return;}
  else if(e.key==='End'){setAge(0,true);e.preventDefault();return;}
  if(ns!==null){e.preventDefault();setAge(sToAge(clamp(ns,0,1)),true);}});
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'&&(e.target===document.body||e.target===chart.cv||e.target===gcv)){e.preventDefault();togglePlay();}
  if(e.key==='Escape'&&state.sel)select(null);});

/* ---------- buttons ---------- */
$('#bPlay').addEventListener('click',togglePlay);
$('#spd').addEventListener('change',e=>{state.speed=+e.target.value;});
$('#bScale').addEventListener('click',e=>{const lin=TS.p===1;TS.p=lin?2.5:1;TS.scaleMode=lin?'compressed':'linear';
  e.currentTarget.setAttribute('aria-pressed',lin?'false':'true');e.currentTarget.textContent='Axis: '+(lin?'compressed':'linear');state.dirty=true;});
$('#bLabels').addEventListener('click',e=>{opts.labels=!opts.labels;e.currentTarget.setAttribute('aria-pressed',opts.labels?'true':'false');state.dirty=true;});
$('#bFollow').addEventListener('click',()=>setFollow(!state.follow));

/* ---------- start ---------- */
buildStatic();resize();syncPlay();
{const c=massCentroid(state.age,rotationsAt(state.age));view.lon=c.lon;view.lat=clamp(c.lat,-55,55);}
requestAnimationFrame(frame);

</script>
</body>
